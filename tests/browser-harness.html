<!doctype html><html lang="de"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Responsive QA — local only</title><style>body{margin:0;background:#d9dce3;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button,input{font:inherit;padding:7px}#frame{border:0;background:white;transform-origin:top left;display:block}#holder{margin:auto;overflow:hidden}output{white-space:pre-wrap;font:12px monospace}#results{padding:15px;background:white}</style><header><label>Breite <select id="width"><option>1440</option><option>768</option><option>390</option><option>320</option></select></label><label>Seite <select id="page"><option value="/">Startseite DE</option><option value="/en/">Startseite EN</option><option value="/blog/">Blog</option><option value="/impressum/">Impressum</option><option value="/datenschutz/">Datenschutz</option></select></label><label>Formular-Test <select id="mock"><option value="">aus (nicht senden)</option><option>success</option><option>error</option></select></label><button id="load">Laden</button><button id="measure">Layout prüfen</button><label>Abschnitt <select id="anchor"><option value="main">Start</option><option value="services">Leistungen</option><option value="portfolio">Einblicke</option><option value="pricing">Preise</option><option value="contact">Kontakt</option></select></label><button id="scroll">Anzeigen</button></header><div id="holder"><iframe id="frame" title="Website bei gewählter Breite"></iframe></div><div id="results"><output id="out"></output></div><script>const frame=document.querySelector('#frame'),holder=document.querySelector('#holder');function load(){const width=Number(document.querySelector('#width').value),scale=Math.min(1,(innerWidth-30)/width);frame.style.width=width+'px';frame.style.height='1050px';frame.style.transform='scale('+scale+')';holder.style.width=width*scale+'px';holder.style.height=1050*scale+'px';const mock=document.querySelector('#mock').value;frame.src=document.querySelector('#page').value+(mock?'?form-test='+mock:'');}document.querySelector('#load').onclick=load;document.querySelector('#scroll').onclick=()=>frame.contentDocument.getElementById(document.querySelector('#anchor').value)?.scrollIntoView();document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow;document.querySelector('#out').textContent=JSON.stringify({width:w.innerWidth,scrollWidth:d.documentElement.scrollWidth,overflow:d.documentElement.scrollWidth>w.innerWidth,images:[...d.images].filter(i=>i.complete&&!i.naturalWidth).map(i=>i.src),headings:[...d.querySelectorAll('h1')].map(e=>e.textContent),font:w.getComputedStyle(d.body).fontFamily,fontsLoaded:d.fonts.check('16px Manrope'),overflowing:[...d.querySelectorAll('main *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>w.innerWidth+1||r.left< -1)}).slice(0,8).map(e=>e.tagName+'.'+e.className)},null,2)};load();</script></html>
