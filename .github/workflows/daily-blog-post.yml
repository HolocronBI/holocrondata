name: Daily Blog Post

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create generator script
        run: |
          cat > /tmp/generate.mjs << 'SCRIPT'
          import fs from 'fs';

          const today = new Date();
          const dateStr = today.toISOString().split('T')[0];
          const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 86400000);
          const isPowerBI = dayOfYear % 2 === 0;

          const systemPrompt = `Du bist ein erfahrener Business Intelligence Berater und Autor für das Blog von Holocron Data.
Holocron Data ist ein Freelance-BI-Beratungsunternehmen für den deutschen Mittelstand.
Kernleistungen: Daten-Bestandsaufnahme, Datenbereinigung, Datenmodellierung, Power BI Reports.
Ton: professionell, direkt, praxisnah. Keine Buzzwords, kein Marketing-Sprech.
Zielgruppe: Geschäftsführer und Entscheider in Unternehmen mit 50-500 Mitarbeitern.
Antworte NUR mit einem validen JSON-Objekt. Keine Backticks, keine Präambel, nur JSON.`;

          const topic = isPowerBI
            ? `Power BI Thema für den Mittelstand. Mögliche Themen: DAX-Formeln erklärt, Dashboard-Design-Prinzipien, automatischer Datenrefresh, Row-Level Security, Power Query Transformationen, Star Schema, KPI-Visualisierungen. Wähle ein konkretes spezifisches Thema.`
            : `Datenmanagement Thema für den Mittelstand. Mögliche Themen: Datenqualität verbessern, Excel vs Datenbank, ERP-Daten nutzbar machen, Datensilos aufbrechen, ROI von BI-Projekten, Datenbereinigung in der Praxis, typische Datenfehler, Reporting-Automatisierung. Wähle ein konkretes spezifisches Thema.`;

          const userPrompt = `Schreibe einen deutschen Blog-Beitrag zum Thema: ${topic}

Antworte mit diesem JSON (alle Felder auf Deutsch):
{
  "title": "Vollstaendiger Titel",
  "slug": "url-slug-mit-bindestrichen",
  "excerpt": "2-3 Saetze Zusammenfassung ca 120 Zeichen",
  "tag": "Power BI oder Datenmodellierung oder Datenqualitaet oder Report-Automation oder BI-Strategie",
  "readTime": 5,
  "content": "Vollstaendiger Markdown-Inhalt mindestens 600 Woerter mit ##-Ueberschriften und konkreten Beispielen"
}`;

          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': process.env.ANTHROPIC_API_KEY,
              'anthropic-version': '2023-06-01'
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-20250514',
              max_tokens: 3000,
              system: systemPrompt,
              messages: [{ role: 'user', content: userPrompt }]
            })
          });

          if (!response.ok) {
            const err = await response.text();
            throw new Error(`API error ${response.status}: ${err}`);
          }

          const data = await response.json();
          const text = data.content[0].text.trim().replace(/^```json\n?/, '').replace(/\n?```$/, '').trim();
          const post = JSON.parse(text);

          const fileContent = `---
layout: ../../layouts/BlogPost.astro
title: "${post.title.replace(/"/g, '\\"')}"
excerpt: "${post.excerpt.replace(/"/g, '\\"')}"
date: ${dateStr}
tag: ${post.tag}
readTime: ${post.readTime}
---

${post.content}`;

          const fileName = `src/pages/blog/${post.slug}.md`;
          fs.writeFileSync(fileName, fileContent, 'utf8');
          fs.writeFileSync('/tmp/post_title.txt', post.title);
          fs.writeFileSync('/tmp/post_slug.txt', post.slug);
          console.log('Generated:', fileName);
          SCRIPT

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node /tmp/generate.mjs

      - name: Read metadata
        id: meta
        run: |
          echo "title=$(cat /tmp/post_title.txt)" >> $GITHUB_OUTPUT
          echo "slug=$(cat /tmp/post_slug.txt)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Commit and push branch
        run: |
          BRANCH="blog/auto-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.slug }}"
          git config user.name "Holocron Bot"
          git config user.email "bot@holocrondata.net"
          git checkout -b "$BRANCH"
          git add src/pages/blog/
          git commit -m "blog: ${{ steps.meta.outputs.title }}"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Blog: ${{ steps.meta.outputs.title }}" \
            --body "Neuer Beitrag vom ${{ steps.meta.outputs.date }}. Datei pruefen unter **Files changed**, dann **Merge** zum Veroeffentlichen." \
            --base main \
            --head "$BRANCH"
