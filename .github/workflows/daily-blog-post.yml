name: Daily Blog Post

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Commit and push directly to main
        run: |
          git config user.name "Holocron Bot"
          git config user.email "bot@holocrondata.net"
          git add src/pages/blog/
          git commit -m "blog: auto post $(date +%Y-%m-%d)"
          git push origin main
