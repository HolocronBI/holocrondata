name: Daily Blog Post

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  generate-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate blog post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/generate-post.mjs

      - name: Read metadata
        id: meta
        run: |
          echo "title=$(cat /tmp/post_title.txt)" >> $GITHUB_OUTPUT
          echo "slug=$(cat /tmp/post_slug.txt)" >> $GITHUB_OUTPUT
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Commit and push branch
        run: |
          BRANCH="blog/auto-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.slug }}"
          git config user.name "Holocron Bot"
          git config user.email "bot@holocrondata.net"
          git checkout -b "$BRANCH"
          git add src/pages/blog/
          git commit -m "blog: ${{ steps.meta.outputs.title }}"
          git push origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Blog: ${{ steps.meta.outputs.title }}" \
            --body "Neuer Beitrag vom ${{ steps.meta.outputs.date }}. Unter **Files changed** pruefen, dann **Merge** zum Veroeffentlichen." \
            --base main \
            --head "$BRANCH"
